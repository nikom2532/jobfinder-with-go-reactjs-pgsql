version: '3.8'

services:
  db:
    image: postgres:15
    container_name: jobdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobfinder
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    ports:
      - "5432:5432"

  backend:
    #build: ./backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://postgres:secret@db:5432/jobfinder?sslmode=disable

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: job-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/frontend/app
      - /app/node_modules
    environment:
    - NODE_ENV=development
    - CHOKIDAR_USEPOLLING=true # อีกทางเลือกหนึ่งสำหรับ hot reload ใน Docker
    stdin_open: true # Keep stdin open for interaction
    tty: true        # Allocate a pseudo-TTY
    depends_on:
      - backend

volumes:
  db-data:
